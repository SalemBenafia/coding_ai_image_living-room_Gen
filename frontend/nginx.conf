server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Liveness endpoint for the container healthcheck.
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static assets (SPA-style fallback to index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API proxied to the backend service ----
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SDXL generation can take a while — extend timeouts.
        proxy_connect_timeout 60s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
    }

    # Back-compat: unprefixed /health mirrors the backend.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
