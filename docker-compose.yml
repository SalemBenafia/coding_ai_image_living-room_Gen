# =========================================================================
#  AI Living Room Generator — full stack
#  Start everything:   docker compose up -d --build
#  Logs:               docker compose logs -f backend ai-service
#  Stop:               docker compose down
# =========================================================================
services:

  # ---- Object storage -------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please-123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks: [appnet]

  # ---- AI service: SDXL + LoRA (needs GPU) ----------------------------
  ai-service:
    build: ./ai-service
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please-123}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS:-models}
      SDXL_MODEL_ID: ${SDXL_MODEL_ID:-stabilityai/stable-diffusion-xl-base-1.0}
      LORA_OBJECT: ${LORA_OBJECT:-}
      LORA_SCALE: ${LORA_SCALE:-0.8}
      AI_DEVICE: ${AI_DEVICE:-cuda}
      MAX_STEPS: ${MAX_STEPS:-60}
      MAX_SIDE: ${MAX_SIDE:-1536}
      HF_HOME: ${HF_HOME:-/models/hf_cache}
    volumes:
      - hf_cache:/models/hf_cache
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health').status==200 else 1)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s   # model load can take a while on first boot
    depends_on:
      minio:
        condition: service_healthy
    # ---- GPU access (NVIDIA Container Toolkit required on host) ----
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks: [appnet]

  # ---- Backend API (FastAPI) -----------------------------------------
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-please-123}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET_GENERATED: ${MINIO_BUCKET_GENERATED:-generated-images}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8100}
      MAX_PROMPT_LENGTH: ${MAX_PROMPT_LENGTH:-1000}
      PROMPT_ENHANCER: ${PROMPT_ENHANCER:-local}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen-2.5-32b}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped
    networks: [appnet]

  # ---- Frontend (static site via nginx) ------------------------------
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks: [appnet]

volumes:
  minio_data:
  backend_data:
  hf_cache:

networks:
  appnet:
    driver: bridge
